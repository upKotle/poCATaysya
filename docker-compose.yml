name: scenic-drive
services:
  osrm:
    image: ghcr.io/project-osrm/osrm-backend:v5.27.1
    command: ["osrm-routed", "--algorithm", "mld", "/data/moscow.osrm"]
    volumes:
      - type: bind
        source: ./data/osrm
        target: /data
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      # В образе Debian нет curl; TCP-порт открывается после загрузки графа.
      test: ["CMD", "bash", "-c", "exec 3<>/dev/tcp/127.0.0.1/5000"]
      interval: 10s
      timeout: 3s
      retries: 12
      start_period: 30s
  backend:
    build:
      context: .
      dockerfile: backend/Dockerfile
    environment:
      # Здесь намеренно локальный OSRM, независимо от .env для обычного запуска.
      OSRM_BASE_URL: http://osrm:5000
      OSRM_PROXY_URL: ""
      NO_PROXY: osrm,localhost,127.0.0.1
    depends_on:
      osrm:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/api/health', timeout=2)"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 10s
  frontend:
    build:
      context: .
      dockerfile: frontend/Dockerfile
    ports:
      - "127.0.0.1:8080:80"
    depends_on:
      backend:
        condition: service_healthy
    healthcheck:
      test: ["CMD", "wget", "-q", "-O", "/dev/null", "http://127.0.0.1/healthz"]
      interval: 10s
      timeout: 3s
      retries: 3
      start_period: 5s
