[project]
name = "scenic-drive-backend"
version = "0.1.0"
requires-python = ">=3.12,<3.13"
dependencies = ["fastapi==0.115.12", "httpx==0.28.1", "pydantic==2.11.4", "uvicorn==0.34.2", "shapely==2.1.2", "pyproj==3.7.2", "python-dotenv==1.1.1"]
[dependency-groups]
dev = ["pytest==8.3.5", "pytest-asyncio==0.26.0"]
[tool.pytest.ini_options]
pythonpath = ["."]
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
